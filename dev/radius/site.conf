server default {
    listen {
        type = auth
        ipaddr = *
        port = 1812
    }
    listen {
        type = acct
        ipaddr = *
        port = 1813
    }
    authorize {
        preprocess
        chap
        sql
        if (fail) {
            reject
        }
        noresetcounter
        expiration
        pap
    }
    authenticate {
        Auth-Type PAP {
            pap
        }
        Auth-Type CHAP {
            chap
        }
    }
    preacct {
        acct_unique
    }
    accounting {
        sql
    }
    session {
        sql
    }
}
