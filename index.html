<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0b10" />
<title>FireSpot — carregando…</title>
<noscript>
<meta http-equiv="refresh" content="0; url=desktop.html">
</noscript>
<style>
html,body{height:100%;margin:0}
body{display:grid;place-items:center;font:16px/1.4 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;color:#111}
</style>
</head>
<body>
<div>Carregando versão adequada…</div>
<script>
(function(){
try{
var qp = new URLSearchParams(location.search);
if(qp.has('desktop')){ location.replace('desktop.html'); return; }
if(qp.has('m')){ location.replace('mobile.html'); return; }


var ua = navigator.userAgent || '';
var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints>0);
var smallSide = Math.min(screen.width||innerWidth, screen.height||innerHeight);
var isMobileUA = /(Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Windows Phone)/i.test(ua);
var mobile = isMobileUA || isTouch || smallSide <= 820;
location.replace(mobile ? 'mobile.html' : 'desktop.html');
}catch(e){
// fallback
location.replace('desktop.html');
}
})();
</script>
</body>
</html>
