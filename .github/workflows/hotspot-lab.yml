name: Laboratório Hotspot
on:
  push:
    paths: ["dev/**", "compose*.yaml", "app/**", "portal/**", "portal-v3/**", "migrations/**", "assets/nas/**", "tests/**", ".github/workflows/hotspot-lab.yml"]
  pull_request:
    paths: ["dev/**", "compose*.yaml", "app/**", "portal/**", "portal-v3/**", "migrations/**", "assets/nas/**", "tests/**", ".github/workflows/hotspot-lab.yml"]
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Preparar laboratório fictício
        run: |
          sudo modprobe tun
          python3 dev/lab/setup.py
          python3 dev/lab/preflight.py
      - name: Construir imagens do laboratório
        run: python3 dev/lab/ci_start.py build
      - name: Subir RADIUS, CHR e Firefox nas VLANs
        run: python3 dev/lab/ci_start.py up
      - name: Testar portal, Pix simulado, CoA e cortesia
        run: python3 dev/lab/validate.py
      - name: Diagnóstico sem segredos
        if: failure()
        run: |
          bash dev/lab.sh logs --tail 35 > "$RUNNER_TEMP/lab.log" 2>&1 || true
          bash dev/lab.sh exec -T chr python3 /opt/lab/router.py '/ip hotspot print; /ip hotspot profile print; /system device-mode print; /ip hotspot host print; /ip firewall nat print stats' > "$RUNNER_TEMP/lab-nas.log" 2>&1 || true
          for client in client-a client-b; do
            bash dev/lab.sh exec -T "$client" sh -c 'ip -4 route; ip -4 addr show dev hotspot' > "$RUNNER_TEMP/lab-$client.log" 2>&1 || true
          done
          python3 - <<'PY'
          import os
          from pathlib import Path
          text=Path(os.environ['RUNNER_TEMP']+'/lab.log').read_text()
          for path in Path('dev/.local').iterdir():
              if path.is_file():
                  for line in path.read_text().splitlines():
                      value=line.split('=',1)[-1]
                      if len(value)>=8:text=text.replace(value,'[redacted]')
          print(text)
          for line in text.splitlines():
              if any(word in line for word in ['Error','failed','Fatal','Uncaught','rejected','RADIUS configuration','CHR console diagnostic','Login:']):print('::error::'+line.replace('%','%25').replace('\r','%0D'))
          nas=Path(os.environ['RUNNER_TEMP']+'/lab-nas.log').read_text()
          import re
          nas=re.sub(r'[a-f0-9]{8,}','[redacted]',nas)
          print('::error::Lab NAS: '+nas[-6000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          for client in ['client-a','client-b']:
              routes=Path(os.environ['RUNNER_TEMP']+'/lab-'+client+'.log').read_text()
              print('::error::Lab '+client+' routes: '+routes[-2000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
      - name: Encerrar laboratório
        if: always()
        run: bash dev/lab.sh down -v
