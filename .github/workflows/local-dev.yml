name: Desenvolvimento local

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Testar geração local e publicação por alterações
        run: python3 tests/local_workflow_test.py
      - name: Gerar credenciais fictícias
        run: python3 dev/setup.py --port 8090
      - name: Iniciar Apache, PHP e MariaDB isolados
        run: bash dev/local.sh up -d --build --wait --wait-timeout 240
      - name: Instalar banco e repetir sem recriar credenciais
        run: |
          bash dev/local.sh exec -T web php dev/bootstrap.php
          bash dev/local.sh exec -T web php dev/bootstrap.php
      - name: Testar login e proteção de arquivos internos
        run: python3 dev/smoke.py
      - name: Testar RADIUS e accounting reais
        run: bash dev/local.sh exec -T web php dev/radius/smoke.php
      - name: Verificar segurança do login e RADIUS/CoA
        run: |
          bash dev/local.sh exec -T web php tests/partner_admin_security_test.php
          bash dev/local.sh exec -T web php tests/payment_window_status_test.php
          bash dev/local.sh exec -T web php tests/guest_payment_radius_test.php
      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          bash dev/local.sh logs --tail 60 | tee "$RUNNER_TEMP/firespot-local.log"
          python3 - <<'PY'
          import os
          from pathlib import Path
          for line in (Path(os.environ['RUNNER_TEMP']) / 'firespot-local.log').read_text().splitlines():
              if any(word in line for word in ['Fatal error','Uncaught','RADIUS configuration','Error:','ValueError','PermissionError']):
                  print('::error::' + line.replace('%', '%25').replace('\r', '%0D'))
          PY
          bash dev/local.sh ps -a --format json > "$RUNNER_TEMP/firespot-containers.json"
          python3 - <<'PY'
          import json, subprocess, os
          from pathlib import Path
          text=Path(os.environ['RUNNER_TEMP']+'/firespot-containers.json').read_text().strip()
          objects=json.loads(text) if text.startswith('[') else [json.loads(line) for line in text.splitlines() if line]
          for entry in objects:
              result=subprocess.run(['docker','inspect',entry['ID']],capture_output=True,text=True)
              if not result.returncode:
                  for item in json.loads(result.stdout)[0]['State'].get('Health',{}).get('Log',[]):
                      if item['ExitCode']: print('::error::Health '+entry['Service']+': '+item['Output'].replace('%','%25').replace('\n','%0A')[:1200])
          PY
      - name: Encerrar ambiente de teste
        if: always()
        run: bash dev/local.sh down -v
