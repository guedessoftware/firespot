# Merge with compose.local.yaml through dev/lab.sh. All addresses are lab-only.
services:
  db:
    networks:
      local:
        ipv4_address: 10.203.30.10
  web:
    networks:
      local:
        ipv4_address: 10.203.30.3
  bootstrap:
    secrets:
      - chr_radius_secret
      - chr_admin_password
    networks:
      local:
        ipv4_address: 10.203.30.7
  proxy:
    networks:
      browser:
        ipv4_address: 10.203.40.3
      local:
        ipv4_address: 10.203.30.6
  radius:
    # CoA originates in PHP. Share the web IP, as on an app + RADIUS production host.
    networks: !reset []
    network_mode: service:web
  payments:
    build:
      context: ./dev
      dockerfile: lab/payments/Dockerfile
    secrets:
      - lab_payment_token
      - lab_webhook_secret
    volumes:
      - lab_payments:/data
    networks:
      local:
        ipv4_address: 10.203.30.5
  wan:
    image: nginx:stable-alpine
    volumes:
      - ./dev/lab/wan.html:/usr/share/nginx/html/index.html:ro
    networks:
      browser:
        ipv4_address: 10.203.40.10
  chr:
    build:
      context: ./dev
      dockerfile: lab/chr/Dockerfile
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    secrets:
      - chr_radius_secret
      - chr_admin_password
    volumes:
      - lab_chr:/data
    networks:
      browser:
        ipv4_address: 10.203.40.2
      local:
        ipv4_address: 10.203.30.2
      trunk:
        ipv4_address: 10.203.254.2
    depends_on:
      radius:
        condition: service_healthy
    healthcheck:
      test: [CMD, python3, /opt/lab/health.py]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
  client-a:
    build:
      context: ./dev
      dockerfile: lab/client/Dockerfile
    environment:
      LAB_VLAN: "10"
      LAB_CI_DIAGNOSTIC: "${CI:-false}"
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    secrets: [client_vnc_password]
    ports: ["127.0.0.1:6081:6080"]
    shm_size: 256m
    mem_limit: 1g
    networks:
      browser:
        ipv4_address: 10.203.40.11
      trunk:
        ipv4_address: 10.203.254.10
        mac_address: "02:00:00:00:10:01"
    depends_on:
      chr:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "test -f /tmp/hotspot-ready && wget -q -O /dev/null http://127.0.0.1:6080/vnc.html"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  client-b:
    extends:
      service: client-a
    environment:
      LAB_VLAN: "20"
    ports: !override ["127.0.0.1:6082:6080"]
    networks: !override
      browser:
        ipv4_address: 10.203.40.12
      trunk:
        ipv4_address: 10.203.254.20
        mac_address: "02:00:00:00:20:01"

networks:
  browser:
    ipam:
      config: [{subnet: 10.203.40.0/24}]
  local:
    ipam:
      config:
        - subnet: 10.203.30.0/24
          aux_addresses:
            chr_hypervisor: 10.203.30.254
  trunk:
    internal: true
    ipam:
      config: [{subnet: 10.203.254.0/24}]

volumes:
  lab_chr:
  lab_payments:

secrets:
  app_environment:
    file: ./dev/.local/lab.env
  chr_radius_secret:
    file: ./dev/.local/chr-radius-secret
  chr_admin_password:
    file: ./dev/.local/chr-admin-password
  client_vnc_password:
    file: ./dev/.local/client-vnc-password
  lab_payment_token:
    file: ./dev/.local/lab-payment-token
  lab_webhook_secret:
    file: ./dev/.local/lab-webhook-secret
