name: firespot-local

services:
  db:
    image: mariadb:10.6
    environment:
      MARIADB_DATABASE: firespot_local
      MARIADB_USER: firespot_local
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      TZ: America/Manaus
    secrets:
      - db_password
      - db_root_password
    volumes:
      - database:/var/lib/mysql
    networks:
      - local
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build:
      context: ./dev
    environment:
      FIRESPOT_ENV_PATH: /etc/firespot/firespot.env
      FIRESPOT_MASTER_KEY_PATH: /etc/firespot/master.key
      TZ: America/Manaus
    secrets:
      - app_environment
      - master_key
    volumes:
      - .:/var/www/html:ro
      - portal_uploads:/var/www/html/portal-v3/uploads
      - ads_uploads:/var/www/html/assets/ads
    networks:
      - local
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1/dashboard/login.php]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  bootstrap:
    build:
      context: ./dev
    command: [php, dev/radius/bootstrap.php]
    environment:
      FIRESPOT_ENV_PATH: /etc/firespot/firespot.env
      FIRESPOT_MASTER_KEY_PATH: /etc/firespot/master.key
    secrets:
      - app_environment
      - master_key
      - db_root_password
      - radius_db_password
    volumes:
      - .:/var/www/html:ro
      - portal_uploads:/var/www/html/portal-v3/uploads
      - ads_uploads:/var/www/html/assets/ads
    networks:
      - local
    depends_on:
      db:
        condition: service_healthy

  radius:
    build:
      context: ./dev
      dockerfile: radius/Dockerfile
    environment:
      FIRESPOT_RADIUS_LOCAL: "1"
      TZ: America/Manaus
    secrets:
      - radius_db_password
      - radius_probe_secret
    networks:
      - local
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, /opt/firespot-radius/health.sh]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  proxy:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${FIRESPOT_LOCAL_PORT:-8090}:80"
    volumes:
      - ./dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - browser
      - local
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1/dashboard/login.php]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

networks:
  browser:
  local:
    internal: true

volumes:
  database:
  portal_uploads:
  ads_uploads:

secrets:
  db_password:
    file: ./dev/.local/db-password
  db_root_password:
    file: ./dev/.local/db-root-password
  app_environment:
    file: ./dev/.local/firespot.env
  master_key:
    file: ./dev/.local/master.key
  radius_db_password:
    file: ./dev/.local/radius-db-password
  radius_probe_secret:
    file: ./dev/.local/radius-probe-secret
